            - generic [ref=e47]:
              - paragraph [ref=e48]: You’re ready for compassionate support, counseling, and a personalized plan to improve your well-being.
              - paragraph [ref=e49]:
                - strong [ref=e50]: And we’re here for it.
            - paragraph [ref=e54]:
              - text: Mental health is a big part of who we are and how to move through the world. At Better Together, we believe in a holistic approach to mental wellness.
              - link "Our team" [ref=e55] [cursor=pointer]:
                - /url: https://bettertogethermentalhealth.net/our-team
              - text: of licensed, professional therapists are ready to welcome you to a safe, judgement-free counseling relationship where you can open up and spew the feelings you’ve been carrying around. We don’t have a magic pill to make everything better. What we do have is extensive training in a variety of practices with tried-and-true methods for experiencing your emotions and moving through them to the place where you want to be. We’ll help you show up in life, in your relationships, and for yourself the way to wish you could.
