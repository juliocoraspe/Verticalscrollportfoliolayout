          - paragraph [ref=e3007]: How AI becomes an extender arm
          - heading "From idea to working artifact, faster." [level=2] [ref=e3008]
          - paragraph [ref=e3009]: "I am a UX/UI designer and a frontend developer, and AI is the layer that lets me move between those two roles without waiting on either of them. Not \"write the code for me because I don't know how,\" but execute the idea I already have in mind: prototype it, test it, explore around it, and verify whether it stands up technically before it ships."
          - paragraph [ref=e3010]: The model lives in my terminal and my editor. It is how I shorten the gap between "what if it looked like this" and a real thing on the screen.
          - generic [ref=e3011]:
            - generic [ref=e3012]:
              - paragraph [ref=e3013]: "01"
              - generic [ref=e3014]:
                - paragraph [ref=e3015]: Code & Prototyping
                - paragraph [ref=e3016]: I work the model through the terminal, CLIs, and editors like VS Code with Claude Code and Codex, not as a substitute for knowing the code. I read the architecture, I make the calls, and AI executes faster. This portfolio is built that way.
