      - generic [ref=e3156]:
        - paragraph [ref=e3157]: What I know · 06
        - paragraph [ref=e3158]: The knowledge that holds the stack together
        - heading "What I have learned running it." [level=2] [ref=e3159]
        - paragraph [ref=e3160]: Tools alone do not make a system. Context windows, cost, privacy, and runtime behavior shape the output — six things I have come to understand from running this stack myself.
        - generic [ref=e3161]:
          - generic [ref=e3162]:
            - paragraph [ref=e3163]: "01"
            - generic [ref=e3164]:
              - heading "Context Windows & Model Limits" [level=3] [ref=e3165]
              - paragraph [ref=e3166]: I understand how context windows work across models — how much history a model can "see," when to be concise vs. verbose, and how to structure long-running sessions to avoid degradation.
          - generic [ref=e3167]:
            - paragraph [ref=e3168]: "02"
            - generic [ref=e3169]:
              - heading "System Prompts & Custom Modes" [level=3] [ref=e3170]
              - paragraph [ref=e3171]: Beyond standard chat, I configure Claude with persistent instructions via CLAUDE.md and custom slash commands — creating specialized modes for local LLM routing, project-specific context, and workflow automation.
          - generic [ref=e3172]:
            - paragraph [ref=e3173]: "03"
            - generic [ref=e3174]:
              - heading "Local-First AI Architecture" [level=3] [ref=e3175]
              - paragraph [ref=e3176]: Running models locally via Ollama isn't just a cost decision — it's a design constraint I build around. Streaming responses via chunked JSON, multimodal inference with vision models, and bridging plugin sandboxes to localhost APIs are practical skills, not theory.
          - generic [ref=e3177]:
            - paragraph [ref=e3178]: "04"
            - generic [ref=e3179]:
              - heading "Agentic Pipelines with MCP" [level=3] [ref=e3180]
              - paragraph [ref=e3181]: The Model Context Protocol lets AI models use tools programmatically. I've built pipelines where Claude Code autonomously navigates live websites, runs accessibility checks across multiple pages, and generates structured reports.
          - generic [ref=e3182]:
            - paragraph [ref=e3183]: "05"
            - generic [ref=e3184]:
              - heading "Rate Limits, Tiers & Token Economics" [level=3] [ref=e3185]
              - paragraph [ref=e3186]: I think in terms of token budgets — knowing when a task should run locally, when to batch via API, and when to use a smaller model. This shapes how I design AI-augmented tools.
          - generic [ref=e3187]:
            - paragraph [ref=e3188]: "06"
            - generic [ref=e3189]:
              - heading "AI as a Design Systems Tool" [level=3] [ref=e3190]
              - paragraph [ref=e3191]: I apply AI to systematize design decisions — automated layer naming via BEM, accessibility checking at the canvas level, and generative UI exploration. AI isn't a replacement for design judgment.
