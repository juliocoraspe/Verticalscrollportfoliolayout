          - heading "Standards I work toward." [level=2] [ref=e305]
          - generic [ref=e306]:
            - paragraph [ref=e307]: Shared center
            - paragraph [ref=e308]: "The two workflows serve different roles, but they are part of the same practice: accessibility as a design responsibility and as an implementation responsibility. These are the standards both workflows answer to."
        - generic [ref=e309]:
          - generic [ref=e311]:
            - generic [ref=e312]:
              - generic [ref=e313]: "01"
              - generic [ref=e314]: WCAG 2.2 AA
            - paragraph [ref=e315]: Standards
            - paragraph [ref=e316]: I target WCAG 2.2 Level AA compliance as a baseline across every project. Color contrast, focus visibility, semantic structure, and keyboard operability are treated as non-negotiable requirements rather than optional enhancements.
            - paragraph [ref=e317]: Baseline · non-negotiable
          - generic [ref=e319]:
            - generic [ref=e320]:
              - generic [ref=e321]: "02"
              - generic [ref=e322]: 2.1.1 · 2.4.7
            - paragraph [ref=e323]: Keyboard Navigation
            - paragraph [ref=e324]: All interactive elements—buttons, links, toggles, and embedded prototypes—are fully reachable and operable by keyboard alone. Tab order follows the natural reading sequence. A skip-to-main-content link is available at the top of the page for keyboard and assistive technology users.
            - paragraph [ref=e325]: Tab · Shift+Tab · Enter · Space
          - generic [ref=e327]:
            - generic [ref=e328]:
              - generic [ref=e329]: "03"
              - generic [ref=e330]: 2.3.3
            - paragraph [ref=e331]: Motion
            - paragraph [ref=e332]: All animations and transitions respect the prefers-reduced-motion system setting. When reduced motion is enabled, scroll animations, slide transitions, and decorative motion are fully disabled without any loss of content or functionality.
            - paragraph [ref=e333]: prefers-reduced-motion respected
          - generic [ref=e335]:
            - generic [ref=e336]:
              - generic [ref=e337]: "04"
              - generic [ref=e338]: 4.1.2
            - paragraph [ref=e339]: Screen Readers
            - paragraph [ref=e340]: Semantic HTML elements and ARIA landmark regions provide structure for assistive technologies. Interactive components use explicit ARIA labels and aria-expanded / aria-controls attributes to communicate state. Images include descriptive alt text.
            - paragraph [ref=e341]: Semantic HTML · ARIA roles
          - generic [ref=e343]:
            - generic [ref=e344]:
              - generic [ref=e345]: "05"
              - generic [ref=e346]: 1.4.3
            - paragraph [ref=e347]: Color & Contrast
            - paragraph [ref=e348]: Text and interactive elements meet WCAG AA contrast ratios against their backgrounds. Color is never used as the sole means of conveying information—state changes and distinctions are also communicated through text, shape, or position.
            - paragraph [ref=e349]: 4.5:1 normal · 3:1 large
          - generic [ref=e351]:
            - generic [ref=e352]:
              - generic [ref=e353]: "06"
              - generic [ref=e354]: 2.4.7
            - paragraph [ref=e355]: Focus Indicators
            - paragraph [ref=e356]: Visible focus rings are preserved on all interactive elements. Default browser outlines are not suppressed unless replaced with a clearly visible custom indicator that meets or exceeds the original contrast.
            - paragraph [ref=e357]: Outline preserved
        - generic [ref=e359]:
          - generic [ref=e360]:
            - paragraph [ref=e361]: Second method · after launch
            - heading "When the product already exists, the method changes." [level=3] [ref=e362]
          - paragraph [ref=e363]: At that point I shift from design prevention to implementation repair. The same WCAG baseline is checked through Claude Code, Playwright, axe-core, browser automation, and human review so an existing site can be diagnosed, fixed, and explained clearly from my own machine.
