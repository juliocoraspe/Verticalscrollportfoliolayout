                - paragraph [ref=e4015]: Visual Exploration
                - paragraph [ref=e4016]: When I need to test a visual idea before committing, I generate it. Small generative-art-style probes like shape systems, motion sketches, and color studies let me feel a direction out in minutes instead of hours. The frames on the left hold a few of those artifacts.
