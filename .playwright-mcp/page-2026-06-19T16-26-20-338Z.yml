      - generic [ref=e3049]:
        - paragraph [ref=e3050]: What I know · 06
        - paragraph [ref=e3051]: The knowledge that holds the stack together
        - heading "What I have learned running it." [level=2] [ref=e4138]
        - paragraph [ref=e3053]: Tools alone do not make a system. Context windows, cost, privacy, and runtime behavior shape the output — six things I have come to understand from running this stack myself.
        - generic [ref=e4139]:
          - generic [ref=e4140]:
            - paragraph [ref=e4141]: "01"
            - generic [ref=e4142]:
              - heading "Context Windows & Model Limits" [level=3] [ref=e4143]
              - paragraph [ref=e4144]: I understand how context windows work across models — how much history a model can "see," when to be concise vs. verbose, and how to structure long-running sessions to avoid degradation.
          - generic [ref=e4145]:
            - paragraph [ref=e4146]: "02"
            - generic [ref=e4147]:
              - heading "System Prompts & Custom Modes" [level=3] [ref=e4148]
              - paragraph [ref=e4149]: Beyond standard chat, I configure Claude with persistent instructions via CLAUDE.md and custom slash commands — creating specialized modes for local LLM routing, project-specific context, and workflow automation.
          - generic [ref=e4150]:
            - paragraph [ref=e4151]: "03"
            - generic [ref=e4152]:
              - heading "Local-First AI Architecture" [level=3] [ref=e4153]
              - paragraph [ref=e4154]: Running models locally via Ollama isn't just a cost decision — it's a design constraint I build around. Streaming responses via chunked JSON, multimodal inference with vision models, and bridging plugin sandboxes to localhost APIs are practical skills, not theory.
          - generic [ref=e4155]:
            - paragraph [ref=e4156]: "04"
            - generic [ref=e4157]:
              - heading "Agentic Pipelines with MCP" [level=3] [ref=e4158]
              - paragraph [ref=e4159]: The Model Context Protocol lets AI models use tools programmatically. I've built pipelines where Claude Code autonomously navigates live websites, runs accessibility checks across multiple pages, and generates structured reports.
          - generic [ref=e4160]:
            - paragraph [ref=e4161]: "05"
            - generic [ref=e4162]:
              - heading "Rate Limits, Tiers & Token Economics" [level=3] [ref=e4163]
              - paragraph [ref=e4164]: I think in terms of token budgets — knowing when a task should run locally, when to batch via API, and when to use a smaller model. This shapes how I design AI-augmented tools.
          - generic [ref=e4165]:
            - paragraph [ref=e4166]: "06"
            - generic [ref=e4167]:
              - heading "AI as a Design Systems Tool" [level=3] [ref=e4168]
              - paragraph [ref=e4169]: I apply AI to systematize design decisions — automated layer naming via BEM, accessibility checking at the canvas level, and generative UI exploration. AI isn't a replacement for design judgment.
