    - generic [ref=e517]:
      - generic [ref=e518]:
        - heading "This portfolio's accessibility" [level=2] [ref=e519]
        - paragraph [ref=e520]: Accessibility is a foundational constraint in this portfolio—not an afterthought. The following outlines the standards and design decisions applied throughout.
      - generic [ref=e521]:
        - generic [ref=e522]:
          - paragraph [ref=e523]: Standards
          - paragraph [ref=e524]: This portfolio targets WCAG 2.1 Level AA compliance as a baseline. Color contrast, focus visibility, semantic structure, and keyboard operability are treated as non-negotiable requirements rather than optional enhancements.
        - generic [ref=e525]:
          - paragraph [ref=e526]: Keyboard Navigation
          - generic [ref=e527]:
            - paragraph [ref=e528]: All interactive elements—buttons, links, toggles, and embedded prototypes—are fully reachable and operable by keyboard alone. Tab order follows the natural reading sequence.
            - paragraph [ref=e529]: A skip-to-main-content link is available at the top of the page for keyboard and assistive technology users. It becomes visible on focus.
        - generic [ref=e530]:
          - paragraph [ref=e531]: Motion
          - paragraph [ref=e532]:
            - text: All animations and transitions respect the
            - code [ref=e533]: prefers-reduced-motion
            - text: system setting. When reduced motion is enabled, scroll animations, slide transitions, and decorative motion are fully disabled without any loss of content or functionality.
        - generic [ref=e534]:
          - paragraph [ref=e535]: Screen Readers
          - paragraph [ref=e536]:
            - text: Semantic HTML elements and ARIA landmark regions provide structure for assistive technologies. Interactive components use explicit ARIA labels and
            - code [ref=e537]: aria-expanded
            - text: /
            - code [ref=e538]: aria-controls
            - text: attributes to communicate state. Images include descriptive alt text.
        - generic [ref=e539]:
          - paragraph [ref=e540]: Color & Contrast
          - paragraph [ref=e541]: Text and interactive elements meet WCAG AA contrast ratios against their backgrounds. Color is never used as the sole means of conveying information—state changes and distinctions are also communicated through text, shape, or position.
        - generic [ref=e542]:
          - paragraph [ref=e543]: Focus Indicators
          - paragraph [ref=e544]: Visible focus rings are preserved on all interactive elements. Default browser outlines are not suppressed unless replaced with a clearly visible custom indicator that meets or exceeds the original contrast.
        - generic [ref=e545]:
          - paragraph [ref=e546]: Feedback
          - generic [ref=e547]:
            - paragraph [ref=e548]: If you encounter an accessibility barrier or have feedback on how this portfolio can better support your needs, please reach out directly.
