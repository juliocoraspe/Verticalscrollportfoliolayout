          - paragraph [ref=e152]: Inside the design tool · handoff
          - heading "Figma BEM Layer Name" [level=3] [ref=e153]
          - paragraph [ref=e154]: It's a plugin that automatically renames Figma layers using BEM methodology, making component structure legible for developers and design handoff predictable at scale. A deterministic heuristics engine runs first (zero latency, zero dependencies), and a local LLM bridge optionally refines ambiguous names with semantic context.
          - paragraph [ref=e155]: TypeScript, Figma Plugin API, esbuild, and a local Express service that proxies to Ollama — fully offline, no cloud, no subscriptions.
          - generic [ref=e156]:
            - generic [ref=e157]:
              - paragraph [ref=e158]: "01"
              - generic [ref=e159]:
                - paragraph [ref=e160]: Heuristic engine — zero latency
                - paragraph [ref=e161]: A DFS tree-walk builds a NodeSummary per layer — counting texts, buttons, images, nav items — then runs a priority cascade (screen → keyword → structure) to assign the BEM block. Runs in ~0ms, always.
                - generic [ref=e162]:
                  - paragraph [ref=e163]: summarizeNode()
                  - paragraph [ref=e164]: detectBlock()
                  - paragraph [ref=e165]: detectModifiers()
            - generic [ref=e166]:
