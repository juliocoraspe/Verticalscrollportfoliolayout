              - generic [ref=e168]:
                - paragraph [ref=e169]: AI refinement via Ollama bridge
                - paragraph [ref=e170]: Ambiguous nodes are sent to a local Express service (port 3333) with a deterministic fingerprint for LRU caching. gpt-oss:20b refines the heuristic name at temperature 0.1 — max 24 tokens. Falls back to heuristic on failure.
