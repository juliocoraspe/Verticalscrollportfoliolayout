        - paragraph [ref=e1195]: What I know · 06
        - paragraph [ref=e1196]: The knowledge that holds the stack together
        - heading "What I have learned running it." [level=2] [ref=e1197]
        - paragraph [ref=e1198]: Tools alone do not make a system. Context windows, cost, privacy, and runtime behavior shape the output — six things I have come to understand from running this stack myself.
        - generic [ref=e1199]:
          - generic [ref=e1200]:
            - paragraph [ref=e1201]: "01"
            - generic [ref=e1202]:
              - heading "Context Windows & Model Limits" [level=3] [ref=e1203]
              - paragraph [ref=e1204]: I understand how context windows work across models — how much history a model can "see," when to be concise vs. verbose, and how to structure long-running sessions to avoid degradation.
          - generic [ref=e1205]:
            - paragraph [ref=e1206]: "02"
            - generic [ref=e1207]:
              - heading "System Prompts & Custom Modes" [level=3] [ref=e1208]
              - paragraph [ref=e1209]: Beyond standard chat, I configure Claude with persistent instructions via CLAUDE.md and custom slash commands — creating specialized modes for local LLM routing, project-specific context, and workflow automation.
          - generic [ref=e1210]:
            - paragraph [ref=e1211]: "03"
            - generic [ref=e1212]:
              - heading "Local-First AI Architecture" [level=3] [ref=e1213]
              - paragraph [ref=e1214]: Running models locally via Ollama isn't just a cost decision — it's a design constraint I build around. Streaming responses via chunked JSON, multimodal inference with vision models, and bridging plugin sandboxes to localhost APIs are practical skills, not theory.
          - generic [ref=e1215]:
            - paragraph [ref=e1216]: "04"
            - generic [ref=e1217]:
              - heading "Agentic Pipelines with MCP" [level=3] [ref=e1218]
              - paragraph [ref=e1219]: The Model Context Protocol lets AI models use tools programmatically. I've built pipelines where Claude Code autonomously navigates live websites, runs accessibility checks across multiple pages, and generates structured reports.
          - generic [ref=e1220]:
            - paragraph [ref=e1221]: "05"
            - generic [ref=e1222]:
              - heading "Rate Limits, Tiers & Token Economics" [level=3] [ref=e1223]
              - paragraph [ref=e1224]: I think in terms of token budgets — knowing when a task should run locally, when to batch via API, and when to use a smaller model. This shapes how I design AI-augmented tools.
          - generic [ref=e1225]:
            - paragraph [ref=e1226]: "06"
            - generic [ref=e1227]:
              - heading "AI as a Design Systems Tool" [level=3] [ref=e1228]
              - paragraph [ref=e1229]: I apply AI to systematize design decisions — automated layer naming via BEM, accessibility checking at the canvas level, and generative UI exploration. AI isn't a replacement for design judgment.
