      - generic [ref=e516]:
        - heading "Standards I work toward." [level=2] [ref=e518]
        - generic [ref=e519]:
          - paragraph [ref=e520]: Note
          - paragraph [ref=e521]: Accessibility is a foundational constraint in my practice—not an afterthought. The following are the directions I follow on every project I take on.
      - generic [ref=e523]:
        - generic [ref=e524]: Idx
        - generic [ref=e525]: Criterion
        - generic [ref=e526]: Implementation
        - generic [ref=e527]: Detail
      - generic [ref=e528]:
        - generic [ref=e530]:
          - generic [ref=e531]: "01"
          - generic [ref=e532]:
            - paragraph [ref=e533]: Standards
            - paragraph [ref=e534]: WCAG 2.2 AA
          - paragraph [ref=e535]: I target WCAG 2.2 Level AA compliance as a baseline across every project. Color contrast, focus visibility, semantic structure, and keyboard operability are treated as non-negotiable requirements rather than optional enhancements.
          - paragraph [ref=e536]: Baseline · non-negotiable
        - generic [ref=e538]:
          - generic [ref=e539]: "02"
          - generic [ref=e540]:
            - paragraph [ref=e541]: Keyboard Navigation
            - paragraph [ref=e542]: 2.1.1 · 2.4.7
          - paragraph [ref=e543]: All interactive elements—buttons, links, toggles, and embedded prototypes—are fully reachable and operable by keyboard alone. Tab order follows the natural reading sequence. A skip-to-main-content link is available at the top of the page for keyboard and assistive technology users.
          - paragraph [ref=e544]: Tab · Shift+Tab · Enter · Space
        - generic [ref=e546]:
          - generic [ref=e547]: "03"
          - generic [ref=e548]:
            - paragraph [ref=e549]: Motion
            - paragraph [ref=e550]: 2.3.3
          - paragraph [ref=e551]: All animations and transitions respect the prefers-reduced-motion system setting. When reduced motion is enabled, scroll animations, slide transitions, and decorative motion are fully disabled without any loss of content or functionality.
          - paragraph [ref=e552]: prefers-reduced-motion respected
        - generic [ref=e554]:
          - generic [ref=e555]: "04"
          - generic [ref=e556]:
            - paragraph [ref=e557]: Screen Readers
            - paragraph [ref=e558]: 4.1.2
          - paragraph [ref=e559]: Semantic HTML elements and ARIA landmark regions provide structure for assistive technologies. Interactive components use explicit ARIA labels and aria-expanded / aria-controls attributes to communicate state. Images include descriptive alt text.
          - paragraph [ref=e560]: Semantic HTML · ARIA roles
        - generic [ref=e562]:
          - generic [ref=e563]: "05"
          - generic [ref=e564]:
            - paragraph [ref=e565]: Color & Contrast
            - paragraph [ref=e566]: 1.4.3
          - paragraph [ref=e567]: Text and interactive elements meet WCAG AA contrast ratios against their backgrounds. Color is never used as the sole means of conveying information—state changes and distinctions are also communicated through text, shape, or position.
          - paragraph [ref=e568]: 4.5:1 normal · 3:1 large
        - generic [ref=e570]:
          - generic [ref=e571]: "06"
          - generic [ref=e572]:
            - paragraph [ref=e573]: Focus Indicators
            - paragraph [ref=e574]: 2.4.7
          - paragraph [ref=e575]: Visible focus rings are preserved on all interactive elements. Default browser outlines are not suppressed unless replaced with a clearly visible custom indicator that meets or exceeds the original contrast.
          - paragraph [ref=e576]: Outline preserved
