                - generic [ref=e220]:
                  - heading "Context Windows & Model Limits" [level=3] [ref=e221]
                  - paragraph [ref=e222]: I work within each model's context window — when to be concise, and how to structure long sessions so they don't degrade.
              - generic [ref=e223]:
