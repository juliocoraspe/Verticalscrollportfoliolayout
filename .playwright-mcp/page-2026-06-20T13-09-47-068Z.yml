            - paragraph: Plugin I built · 01 of 02
            - heading "Figma BEM Layer Name" [level=2]
            - paragraph: It renames Figma layers with pure BEM so component structure stays legible and handoff predictable. A deterministic heuristics engine runs first at zero latency; a local LLM bridge refines ambiguous names with semantic context.
            - paragraph: TypeScript, Figma Plugin API, esbuild, and a local Express service that proxies to Ollama — fully offline, no cloud, no subscriptions.
