            - paragraph: Plugin I built · 02 of 02
            - heading "Figma Accessibility Auditor" [level=2]
            - paragraph: It checks six WCAG 2.2 AA criteria right on the Figma canvas — contrast, tap targets, focus visibility — with overlay annotations. A local llama3.2-vision model via Ollama suggests alt text and reviews tab order. No API keys, no per-token costs.
