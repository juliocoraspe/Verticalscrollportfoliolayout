                - generic [ref=e230]:
                  - heading "Local-First AI Architecture" [level=3] [ref=e231]
                  - paragraph [ref=e232]: "Running models locally via Ollama is a design constraint I build around: streaming, vision inference, sandbox-to-localhost bridges."
