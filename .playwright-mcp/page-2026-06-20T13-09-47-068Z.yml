                - generic [ref=e55]:
                  - paragraph [ref=e56]: Heuristic engine — zero latency
                  - paragraph [ref=e57]: A DFS tree-walk builds a NodeSummary per layer, then a priority cascade (screen → keyword → structure) assigns the BEM block. Runs in ~0ms.
