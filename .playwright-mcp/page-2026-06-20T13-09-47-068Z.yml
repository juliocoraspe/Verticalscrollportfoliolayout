                - generic [ref=e225]:
                  - heading "System Prompts & Custom Modes" [level=3] [ref=e226]
                  - paragraph [ref=e227]: I configure Claude with persistent instructions (CLAUDE.md) and custom slash commands — specialized modes, not just chat.
