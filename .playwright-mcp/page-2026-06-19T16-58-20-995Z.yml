        - paragraph [ref=e5313]: What I know · 05
        - paragraph [ref=e5314]: The knowledge that holds the stack together
        - heading "What I have learned running it." [level=2] [ref=e5315]
        - paragraph [ref=e5316]: Tools alone do not make a system. Context windows, cost, privacy, and runtime behavior shape the output — six things I have come to understand from running this stack myself.
        - generic [ref=e5317]:
          - generic [ref=e5318]:
            - paragraph [ref=e5319]: "01"
            - generic [ref=e5320]:
              - heading "Context Windows & Model Limits" [level=3] [ref=e5321]
              - paragraph [ref=e5322]: I understand how context windows work across models — how much history a model can "see," when to be concise vs. verbose, and how to structure long-running sessions to avoid degradation.
          - generic [ref=e5323]:
            - paragraph [ref=e5324]: "02"
            - generic [ref=e5325]:
              - heading "System Prompts & Custom Modes" [level=3] [ref=e5326]
              - paragraph [ref=e5327]: Beyond standard chat, I configure Claude with persistent instructions via CLAUDE.md and custom slash commands — creating specialized modes for local LLM routing, project-specific context, and workflow automation.
          - generic [ref=e5328]:
            - paragraph [ref=e5329]: "03"
            - generic [ref=e5330]:
              - heading "Local-First AI Architecture" [level=3] [ref=e5331]
              - paragraph [ref=e5332]: Running models locally via Ollama isn't just a cost decision — it's a design constraint I build around. Streaming responses via chunked JSON, multimodal inference with vision models, and bridging plugin sandboxes to localhost APIs are practical skills, not theory.
          - generic [ref=e5333]:
            - paragraph [ref=e5334]: "04"
            - generic [ref=e5335]:
              - heading "Agentic Pipelines with MCP" [level=3] [ref=e5336]
              - paragraph [ref=e5337]: The Model Context Protocol lets AI models use tools programmatically. I've built pipelines where Claude Code autonomously navigates live websites, runs accessibility checks across multiple pages, and generates structured reports.
          - generic [ref=e5338]:
            - paragraph [ref=e5339]: "05"
            - generic [ref=e5340]:
              - heading "Rate Limits, Tiers & Token Economics" [level=3] [ref=e5341]
              - paragraph [ref=e5342]: I think in terms of token budgets — knowing when a task should run locally, when to batch via API, and when to use a smaller model. This shapes how I design AI-augmented tools.
          - generic [ref=e5343]:
            - paragraph [ref=e5344]: "06"
            - generic [ref=e5345]:
              - heading "AI as a Design Systems Tool" [level=3] [ref=e5346]
              - paragraph [ref=e5347]: I apply AI to systematize design decisions — automated layer naming via BEM, accessibility checking at the canvas level, and generative UI exploration. AI isn't a replacement for design judgment.
