          - paragraph [ref=e2166]: Inside the design tool · handoff
          - heading "Figma BEM Layer Name" [level=3] [ref=e4352]
          - paragraph [ref=e2168]: It's a plugin that automatically renames Figma layers using BEM methodology, making component structure legible for developers and design handoff predictable at scale. A deterministic heuristics engine runs first (zero latency, zero dependencies), and a local LLM bridge optionally refines ambiguous names with semantic context.
          - paragraph [ref=e4353]: TypeScript, Figma Plugin API, esbuild, and a local Express service that proxies to Ollama — fully offline, no cloud, no subscriptions.
          - generic [ref=e4354]:
            - generic [ref=e4355]:
              - paragraph [ref=e4356]: "01"
              - generic [ref=e4357]:
                - paragraph [ref=e4358]: Heuristic engine — zero latency
                - paragraph [ref=e4359]: A DFS tree-walk builds a NodeSummary per layer — counting texts, buttons, images, nav items — then runs a priority cascade (screen → keyword → structure) to assign the BEM block. Runs in ~0ms, always.
                - generic [ref=e4360]:
                  - paragraph [ref=e4361]: summarizeNode()
                  - paragraph [ref=e4362]: detectBlock()
                  - paragraph [ref=e4363]: detectModifiers()
            - generic [ref=e4364]:
              - paragraph [ref=e4365]: "02"
              - generic [ref=e4366]:
                - paragraph [ref=e4367]: AI refinement via Ollama bridge
                - paragraph [ref=e4368]: Ambiguous nodes are sent to a local Express service (port 3333) with a deterministic fingerprint for LRU caching. gpt-oss:20b refines the heuristic name at temperature 0.1 — max 24 tokens. Falls back to heuristic on failure.
                - generic [ref=e4369]:
                  - paragraph [ref=e4370]: gpt-oss:20b
                  - paragraph [ref=e4371]: LRU cache (TTL 30 min)
                  - paragraph [ref=e4372]: Express / Zod
            - generic [ref=e4373]:
