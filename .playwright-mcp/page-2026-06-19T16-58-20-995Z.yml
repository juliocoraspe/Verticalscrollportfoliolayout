              - generic [ref=e4375]:
                - paragraph [ref=e4376]: Plugin architecture
                - paragraph [ref=e4377]: Built with esbuild (IIFE format) for Figma sandbox compatibility. UI and plugin communicate via message-passing — hover on a result row selects the corresponding canvas node. Panel size persists across sessions via clientStorage.
