        - paragraph [ref=e2656]: What I know · 05
        - paragraph [ref=e2657]: The knowledge that holds the stack together
        - heading "What I have learned running it." [level=2] [ref=e2658]
        - paragraph [ref=e2659]: Tools alone do not make a system. Context windows, cost, privacy, and runtime behavior shape the output — six things I have come to understand from running this stack myself.
        - generic [ref=e2660]:
          - generic [ref=e2661]:
            - paragraph [ref=e2662]: "01"
            - generic [ref=e2663]:
              - heading "Context Windows & Model Limits" [level=3] [ref=e2664]
              - paragraph [ref=e2665]: I understand how context windows work across models — how much history a model can "see," when to be concise vs. verbose, and how to structure long-running sessions to avoid degradation.
          - generic [ref=e2666]:
            - paragraph [ref=e2667]: "02"
            - generic [ref=e2668]:
              - heading "System Prompts & Custom Modes" [level=3] [ref=e2669]
              - paragraph [ref=e2670]: Beyond standard chat, I configure Claude with persistent instructions via CLAUDE.md and custom slash commands — creating specialized modes for local LLM routing, project-specific context, and workflow automation.
          - generic [ref=e2671]:
            - paragraph [ref=e2672]: "03"
            - generic [ref=e2673]:
              - heading "Local-First AI Architecture" [level=3] [ref=e2674]
              - paragraph [ref=e2675]: Running models locally via Ollama isn't just a cost decision — it's a design constraint I build around. Streaming responses via chunked JSON, multimodal inference with vision models, and bridging plugin sandboxes to localhost APIs are practical skills, not theory.
          - generic [ref=e2676]:
            - paragraph [ref=e2677]: "04"
            - generic [ref=e2678]:
              - heading "Agentic Pipelines with MCP" [level=3] [ref=e2679]
              - paragraph [ref=e2680]: The Model Context Protocol lets AI models use tools programmatically. I've built pipelines where Claude Code autonomously navigates live websites, runs accessibility checks across multiple pages, and generates structured reports.
          - generic [ref=e2681]:
            - paragraph [ref=e2682]: "05"
            - generic [ref=e2683]:
              - heading "Rate Limits, Tiers & Token Economics" [level=3] [ref=e2684]
              - paragraph [ref=e2685]: I think in terms of token budgets — knowing when a task should run locally, when to batch via API, and when to use a smaller model. This shapes how I design AI-augmented tools.
          - generic [ref=e2686]:
            - paragraph [ref=e2687]: "06"
            - generic [ref=e2688]:
              - heading "AI as a Design Systems Tool" [level=3] [ref=e2689]
              - paragraph [ref=e2690]: I apply AI to systematize design decisions — automated layer naming via BEM, accessibility checking at the canvas level, and generative UI exploration. AI isn't a replacement for design judgment.
