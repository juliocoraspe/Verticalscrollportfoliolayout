          - paragraph [ref=e1737]: Inside the design tool · handoff
          - heading "Figma BEM Layer Name" [level=3] [ref=e1738]
          - paragraph [ref=e1739]: It's a plugin that automatically renames Figma layers using BEM methodology, making component structure legible for developers and design handoff predictable at scale. A deterministic heuristics engine runs first (zero latency, zero dependencies), and a local LLM bridge optionally refines ambiguous names with semantic context.
          - paragraph [ref=e1740]: TypeScript, Figma Plugin API, esbuild, and a local Express service that proxies to Ollama — fully offline, no cloud, no subscriptions.
          - generic [ref=e1741]:
            - generic [ref=e1742]:
              - paragraph [ref=e1743]: "01"
              - generic [ref=e1744]:
                - paragraph [ref=e1745]: Heuristic engine — zero latency
                - paragraph [ref=e1746]: A DFS tree-walk builds a NodeSummary per layer — counting texts, buttons, images, nav items — then runs a priority cascade (screen → keyword → structure) to assign the BEM block. Runs in ~0ms, always.
                - generic [ref=e1747]:
                  - paragraph [ref=e1748]: summarizeNode()
                  - paragraph [ref=e1749]: detectBlock()
                  - paragraph [ref=e1750]: detectModifiers()
            - generic [ref=e1751]:
              - paragraph [ref=e1752]: "02"
              - generic [ref=e1753]:
                - paragraph [ref=e1754]: AI refinement via Ollama bridge
                - paragraph [ref=e1755]: Ambiguous nodes are sent to a local Express service (port 3333) with a deterministic fingerprint for LRU caching. gpt-oss:20b refines the heuristic name at temperature 0.1 — max 24 tokens. Falls back to heuristic on failure.
                - generic [ref=e1756]:
                  - paragraph [ref=e1757]: gpt-oss:20b
                  - paragraph [ref=e1758]: LRU cache (TTL 30 min)
                  - paragraph [ref=e1759]: Express / Zod
